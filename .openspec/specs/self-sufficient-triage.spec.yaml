title: Triage findings, respect declared limitations, protect the thesis, say what to do next
slug: self-sufficient-triage
type: feature
status: review
author: Claude
created_at: '2026-09-25'
updated_at: '2026-09-25'
roles:
  implementer: '@arananet'
  reviewer: '@arananet'
  qa: '@arananet'
