title: Show what the repair agent is doing while it does it
slug: live-repair-agent-output
type: feature
status: review
author: Claude
created_at: '2026-09-22'
updated_at: '2026-09-22'
roles:
  implementer: '@arananet'
  reviewer: '@arananet'
