description: |
  Veritas Gate evaluates artifacts (papers, repositories, documents, designs)
  independently of whatever generated them. This spec covers the v0.1 core:
  domain models (Artifact, Finding, JudgeResult, CheckResult, EvaluationResult,
  Claim/ClaimGraph), profile-driven configuration, LLM provider adapters for
  Anthropic, OpenAI and Google, blind independent LLM judges, deterministic
  allow-listed checks, a claim graph with evidence coverage, a MetaJudge that
  preserves critical findings instead of averaging them, a deterministic gate
  engine, immutable run directories under .veritas/runs/, Markdown + JSON
  reports, a repair plan, and the `veritas` CLI with CI-meaningful exit codes.
  Evaluation never modifies the artifact it judges.
acceptance_criteria:
- "Given a profile YAML and an artifact path, when `veritas evaluate <path>` runs, then judges and checks execute, a claim graph is built, the MetaJudge consolidates findings, the gate is evaluated, and reports are written to an immutable run directory under `.veritas/runs/<timestamp>/`."
- "Given a gate policy with `fail_on: [critical]` and `max_major: 0`, when any critical finding exists, then the gate status is FAIL and the CLI exit code is 3; when only major findings exceed the limit, the status is REVISE and the exit code is 2."
- "Given several judges that report overlapping findings, when the MetaJudge consolidates them, then duplicates are grouped into one consolidated finding whose severity is the maximum reported severity, and no critical or major finding is dropped or averaged away."
- "Given artifact content containing embedded instructions aimed at the judge, when a judge prompt is assembled, then the artifact content is wrapped in an untrusted-data envelope and the system prompt forbids following instructions found inside it."
- "Given a check whose command is not present in `execution.allow`, when checks run, then the command is not executed and the check reports an error result instead."
- "Given a malformed or non-conforming LLM response, when a judge parses it, then a structured error result is produced rather than an unhandled exception, and the run continues."
- "Given judges that could not complete (unreachable provider, missing credentials, malformed responses), when the gate is evaluated, then it never reports PASS: the failed judges are named in the gate result and the run is reported as not fully evaluated."
- "Given a completed run, when `veritas report`, `veritas findings`, `veritas claims` and `veritas gate` are invoked, then each reads the persisted run and returns the recorded data with the documented exit codes (0 pass, 1 warnings, 2 revise, 3 fail)."
- "Given a finding listed in gate.accepted_risks with a reason, when the gate is evaluated, then that finding no longer blocks but is still counted in the severity totals and named as an accepted risk; an acceptance that matches no finding or has expired is reported as stale and does not suppress anything."
- "Given a judge or check that is running, when the console reports progress, then it never falls silent for the duration of that work: a spinner names what is in flight until it completes."
- "Given a configured path that resolves outside the artifact directory, when files are collected, then they are described relative to the artifact rather than by absolute path, and the run reports that paths reach outside it."
- "Given a file longer than the configured per-file limit, when an evaluation runs, then the truncation is reported before the judges run, and a manuscript of ordinary length is never truncated by default."
- "Given an artifact and a profile, when `veritas files` is invoked, then it lists every file the judges would read with its size and an approximate per-judge token count, without contacting any provider."
- "Given a project initialised with `veritas init`, when the written config is loaded unmodified, then every provider, model and TLS setting resolves from the environment and no credential appears in the file."
- "Given `veritas evaluate . --judge evidence --runs 3`, when the same judge is run repeatedly, then per-run results are stored and a stability rating is recorded for that judge."
test_plan:
- 'Unit test: gate engine policy evaluation across PASS / PASS_WITH_WARNINGS / REVISE / FAIL including required-check failures and blocking finding ids.'
- 'Unit test: Finding and JudgeResult schema validation, including rejection of invalid severities and confidence bounds, and evidence-free findings receiving reduced confidence.'
- 'Unit test: MetaJudge deduplication, consensus, disagreement detection, and preservation of critical findings.'
- 'Unit test: ClaimGraph construction, claim/evidence linking, status resolution and evidence coverage computation.'
- 'Unit test: configuration loading with ${ENV_VAR} interpolation, profile resolution and missing-secret error reporting.'
- 'Unit test: TLS verification defaults to on, accepts a CA bundle path or the system trust store, and prints a warning naming the endpoint when it is disabled.'
- 'Unit test: TLS values interpolated from the environment arrive as strings and are read as booleans, not as file paths.'
- 'Unit test: sampling parameters are omitted from a provider request unless explicitly configured, and are sent when they are.'
- 'Unit test: the OpenAI output-length parameter adapts to whichever field the endpoint accepts, and each compatibility fallback is attempted at most once.'
- 'Unit test: a 429 reporting an exhausted quota fails immediately, while an ordinary rate limit is still retried.'
- 'Unit test: accepted risks stop blocking without changing the reported counts, do not excuse other findings or failing required checks, expire, and are reported as stale when they match nothing.'
- 'Unit test: the content-derived issue id survives rewording and renumbering of the same finding.'
- 'Unit test: a gate evaluated with judge errors fails, names the failed judges, and the behaviour can be disabled explicitly.'
- 'Integration test: an evaluation against an unreachable provider exits 3 with FAIL rather than 0 with PASS.'
- 'Unit test: profile discovery resolves the shipped profiles for an artifact whose config lives in a subdirectory, under both an editable and a built install.'
- 'Unit test: provider payload construction and response parsing for Anthropic, OpenAI and Google against locally served HTTP responses (no network, no API keys).'
- 'Unit test: command check allow-list enforcement rejects non-allow-listed commands.'
- 'Integration test: full pipeline over `examples/generic-document` using a locally served provider endpoint, asserting run directory contents, report files and CLI exit codes.'
qa_notes: |
  Live-provider integration tests are opt-in and skipped unless the matching
  API key environment variables are set. The default test suite must pass
  offline with no API keys configured.

  Implementation evidence: provider adapters are exercised against a local HTTP
  server rather than a patched client, so the request payloads and response
  parsing under test are the ones that would go over the wire. The full suite
  runs with no API keys and no network access.
out_of_scope:
- Automatic artifact repair (`veritas repair`); v0.1 only emits repair-plan.json.
- Web UI or hosted service.
- Profiles other than scientific-paper and a generic document profile.
implementation_skill:
eval_plan:
  scenarios:
  - Deliberately flawed example paper produces a non-PASS gate with blocking findings.
  metrics:
  - Evidence coverage percentage reported for the claim graph.
technical_notes: |
  Provider requests carry only what was configured. A parameter nobody set is
  not sent: vendors deprecate them (current Claude models reject `temperature`
  with a 400), and a default that is invisible in configuration is a default
  nobody can debug.

  Model ids are configuration, never code: the shipped examples name current ids
  as documentation, and tests must not depend on those literals. The OpenSpec
  template's own agents (spec review, issue auto-fix) carry GitHub Models
  catalog ids, which are a different namespace from the provider ids Veritas
  uses; the maintainer has verified the current names against that catalog.

  The shipped default is claude-opus-5. Seven judges read the whole artifact on
  every evaluation, so the per-run cost is a real choice: claude-sonnet-5 is the
  documented step-down.

  Python 3.12+, Typer, Pydantic v2, httpx, PyYAML, Rich. asyncio orchestration
  implemented directly; no agent framework. Secrets come only from environment
  variables (.env.example documents them). Judges are blind in phase one: they
  never receive other judges' results, generator prompts, or prior repair
  attempts. Only the MetaJudge sees multiple judge results. The gate decision is
  deterministic Python, never an LLM call.
