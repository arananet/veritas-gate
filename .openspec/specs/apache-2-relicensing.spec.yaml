technical_notes: |
  The Apache-2.0 text is the canonical copy from apache.org, with only the
  appendix placeholders filled in. Hatchling emits License-Expression and
  License-File metadata from the `license` and `license-files` keys in
  pyproject.toml, which replaces the previous `license = { file = ... }` form.
