description: |
  Initialize Veritas Gate from the OpenSpec template and implement milestone 1
  of the user's product brief: an artifact-independent evaluation pipeline that
  works entirely offline with a mock provider, a fake judge, structured results,
  and a deterministic quality gate. Establish interfaces for later providers,
  profiles, judges, checks, and evidence verification without coupling the core
  to scientific papers. This milestone is a foundation, not the complete v0.1.
acceptance_criteria:
- "After confirmed onboarding, project configuration and governance identify veritas-gate; template-internal specs and the template marker are removed."
- "Python 3.12+ packaging installs a veritas CLI using Typer, Pydantic v2, asyncio, Rich, PyYAML and httpx, with pytest, pytest-asyncio, Ruff and mypy development tooling."
- "Artifact, Finding, JudgeResult, CheckResult and EvaluationResult validate structured data, including severity, confidence bounds and evidence; evidence-free findings have reduced confidence."
- "Judge, Check and ModelProvider protocols permit independent implementations without domain-specific changes to orchestration."
- "MockProvider returns schema-validated fixture responses without network access or API keys; malformed responses are rejected."
- "The fake judge is explicitly identified as a demonstration and uses artifact data without executing it; each judge receives a blind context without other judge results or generator history."
- "The deterministic gate preserves every critical and major finding, enforces fail_on and count limits, and blocks on missing or unsuccessful required checks without averaging scores."
- "Gate statuses PASS, PASS_WITH_WARNINGS, REVISE and FAIL map respectively to process exit codes 0, 1, 2 and 3; evaluation failures cannot silently produce PASS."
- "veritas init creates configuration and the run directory without overwriting existing configuration; veritas evaluate examples/generic-document completes entirely offline."
- "Each completed evaluation writes results and gate JSON to a unique run directory without overwriting a previous run; report, findings and gate commands inspect persisted results."
- "README starts with the requested product introduction, documents installation and the working mock demo, and distinguishes milestone 1 from the remaining v0.1 roadmap."
test_plan:
- "Unit: validate structured models, invalid severities and confidence, evidence-free confidence reduction, and malformed mock provider output."
- "Unit: verify all gate statuses, severity thresholds, critical finding retention, required checks, and operational failure handling."
- "Async integration: execute independent fake judges and checks, verify isolated context and structured aggregation, and confirm no artifact commands run."
- "CLI integration: initialize twice safely, evaluate the generic document, inspect persisted results, filter findings, and assert all four gate exit codes."
- "Persistence: evaluate twice and confirm distinct run directories and unchanged first-run contents; reject invalid artifact paths and invalid configuration."
- "Validation: run pytest, Ruff, mypy, openspec check, openspec verify for this spec, and inspect openspec status."
qa_notes: "All milestone tests run offline without external API credentials."
