[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "veritas-gate"
version = "0.1.0"
description = "Extensible multi-agent evaluation and quality-gate framework for papers, codebases, architectures, and AI-generated artifacts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Eduardo Arana" }]
keywords = ["evaluation", "quality-gate", "llm", "judges", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
# Verify TLS against the operating system trust store. Install this when a
# corporate proxy intercepts TLS: its CA is already in the system store.
tls = [
  "truststore>=0.9",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "truststore>=0.9",
]

[project.urls]
Homepage = "https://github.com/arananet/veritas-gate"
Issues = "https://github.com/arananet/veritas-gate/issues"

[project.scripts]
veritas = "veritas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "veritas/_bundled_profiles"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the suite runs identically under `pytest` and `python -m pytest`:
# shared test helpers are imported as `tests.<module>`.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:veritas.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["veritas"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
