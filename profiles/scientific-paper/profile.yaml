# Scientific paper profile.
#
# This is a plugin, not core logic. The engine knows nothing about papers;
# everything domain-specific lives in this file, rubric.yaml and prompts/.
profile: scientific-paper
version: "1"
description: Peer-review-style evaluation of a manuscript and its supporting artifacts.
artifact_type: document
default_paths:
  - .

meta_model_role: meta

judges:
  - name: methodology
    prompt: methodology.md
    model_role: methodology
    version: "1"
    description: Research question, experimental design, controls, baselines, metrics.

  - name: evidence
    prompt: evidence.md
    model_role: evidence
    version: "1"
    extracts_claims: true
    description: Extracts the manuscript's claims and classifies how well each is supported.

  - name: statistics
    prompt: statistics.md
    model_role: statistics
    version: "1"
    description: Sample size, runs, variance, tests, effect size, significance claims.

  - name: reproducibility
    prompt: reproducibility.md
    model_role: reproducibility
    version: "1"
    description: Environment, data, seeds, commands, hardware, checkpoints.

  - name: repo-consistency
    prompt: repo_consistency.md
    model_role: repo-consistency
    version: "1"
    description: Discrepancies between the manuscript and the implementation it describes.

  - name: citations
    prompt: citations.md
    model_role: citations
    version: "1"
    description: Whether references exist, are well formed, and support their claims.

  - name: archival
    prompt: archival.md
    model_role: archival
    version: "1"
    description: Whether the work can be found, cited and retrieved, and whether what it cites will hold.

  - name: presentation
    prompt: presentation.md
    model_role: presentation
    version: "1"
    description: Structure, figures and tables, captions, and whether the paper reads as reviewed work.

  - name: adversarial
    prompt: adversarial.md
    model_role: adversarial
    version: "1"
    description: Actively hunts for rejection-level weaknesses.

checks:
  repository-structure:
    type: required-paths
    enabled: true
    severity_on_failure: minor
    required_paths: []

  required-sections:
    type: required-sections
    enabled: true
    severity_on_failure: major
    required_sections:
      - abstract
      - introduction
      - method
      - results
      - conclusion

  # The files a citable, licensable paper needs. Missing ones are reported
  # here and created from your declared metadata by `veritas scaffold`.
  archival-files:
    type: required-paths
    enabled: true
    severity_on_failure: minor
    required_paths:
      - CITATION.cff
      - LICENSE
      - LICENSING.md

  reference-integrity:
    type: reference-integrity
    enabled: true
    severity_on_failure: major
    # Every relative path these documents cite must resolve. A regenerated
    # evidence directory whose name changes leaves the citation pointing at
    # nothing, and that is a path lookup, not a judgement.
    required_paths:
      - paper/manuscript.md
      - paper/REPRODUCTION.md

  # Will the LaTeX source survive arXiv? Missing inputs and figures, a
  # missing .bbl (arXiv does not run BibTeX), undefined citation keys,
  # incomplete references, private comments and the 50 MB limit. Reads files
  # only: nothing is compiled or fetched. Skipped for papers with no .tex main
  # file; set target when several .tex files carry \documentclass.
  arxiv-package:
    type: arxiv-package
    enabled: true
    severity_on_failure: major
    max_package_mb: 50

  # Generated files (figures, tables, LaTeX) declared under `derived:` must
  # match what they were built from (veritas.lock.json, written by
  # `veritas build`). Set target to the manuscript to also report figures no
  # derivation produces.
  derived-freshness:
    type: derived-freshness
    enabled: true
    severity_on_failure: major

  # Frozen evidence (artifact.frozen) is append-only: git must show no commit
  # that modified a frozen file, and nothing modified now. Also compares
  # CITATION.cff's version with the tags, and (with target) the manuscript's
  # archive DOIs with CITATION.cff.
  frozen-integrity:
    type: frozen-integrity
    enabled: true
    severity_on_failure: major

  # What a reader sees first: process narration left in the paper (review
  # pending, tool failures, test tallies, session notes), long hashes repeated,
  # a multi-paragraph abstract, figures never cited, a paper with no figure.
  # Set target to the manuscript to enable it.
  presentation:
    type: presentation
    enabled: true
    severity_on_failure: major

  # The built PDF: unresolved references, replacement characters, fonts not
  # embedded, metadata, and the TeX log's overfull boxes and undefined labels.
  # Set target to the PDF.
  pdf-inspection:
    type: pdf-inspection
    enabled: true
    severity_on_failure: major

  # A venue's rules. Set venue (tmlr, arxiv, preprint), target (PDF) and
  # source (LaTeX). For double-blind venues every identity term (from
  # CITATION.cff, the git remote and identity_terms) is searched in the PDF
  # text, metadata and source.
  venue:
    type: venue
    enabled: true
    severity_on_failure: major

  # Every number in the manuscript must be traceable to the evidence: as a
  # value, a rounding, a percentage, or a ratio whose denominator the paper
  # states. Off until you name the manuscript and the evidence files:
  #   checks: {numeric-traceability: {enabled: true, target: ..., sources: [...]}}
  numeric-traceability:
    type: numeric-traceability
    enabled: false
    severity_on_failure: minor

  # Off by default: these are conventions, not universal requirements, and a
  # profile should not fail a paper for a convention its venue does not hold.
  # Enable in your veritas.yaml and set `target` to your manuscript.
  citability:
    type: content-patterns
    enabled: false
    severity_on_failure: minor
    target: null
    required_patterns:
      - pattern: '10\.\d{4,}/'
        description: a DOI for the archived work
      - pattern: '(?i)data availability|availability statement'
        description: a data availability statement
    forbidden_patterns:
      - pattern: '(?i)(github|gitlab)\.com/\S+/(blob|tree)/(main|master)/'
        description: a link to a mutable branch instead of a pinned commit or tag

gate:
  fail_on:
    - critical
  max_major: 0
  max_minor: 20
  require_checks: []
  warn_on_minor: true

# Files `veritas scaffold` creates when missing, from metadata the operator
# declares once. Nothing is invented: an entry whose required metadata is absent
# is not written. LICENSE itself is not scaffolded -- the full licence text is
# the operator's to choose and add.
scaffold:
  - path: CITATION.cff
    description: Citation metadata, so the work can be cited correctly.
    generator: citation-cff
    requires: [title, authors, licence.content]
  - path: LICENSING.md
    description: Which licence covers the code and which covers text, figures and data.
    template: LICENSING.md
    requires: [licence.code, licence.content]
