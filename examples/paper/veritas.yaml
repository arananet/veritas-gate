version: 1

profile: scientific-paper

artifact:
  type: document
  paths:
    - paper
    - experiments
    - results
    - scripts

# Model ids come from the environment so no vendor name is hard-coded here.
# Copy .env.example at the repository root and export the values.
models:
  default:
    provider: ${VERITAS_DEFAULT_PROVIDER:-anthropic}
    model: ${VERITAS_DEFAULT_MODEL:-claude-opus-5}
  adversarial:
    provider: ${VERITAS_ADVERSARIAL_PROVIDER:-openai}
    model: ${VERITAS_ADVERSARIAL_MODEL:-gpt-5.6-terra}
  meta:
    provider: ${VERITAS_META_PROVIDER:-google}
    model: ${VERITAS_META_MODEL:-gemini-3.1-pro}

gate:
  fail_on:
    - critical
  max_major: 0
  max_minor: 20

checks:
  repository-structure:
    type: required-paths
    enabled: true
    severity_on_failure: minor
    required_paths:
      - paper/main.md
      - results/benchmark.json

  required-sections:
    type: required-sections
    enabled: true
    target: paper/main.md
    severity_on_failure: major
    required_sections:
      - abstract
      - introduction
      - method
      - results
      - conclusion

# Nothing runs unless it is listed here.
execution:
  allow: []

# ─── Autopilot ───────────────────────────────────────────────────────────────
# `veritas loop examples/paper` repairs in an isolated workspace, never here.
workspace:
  mode: snapshot

loop:
  enabled: true
  max_iterations: 5
  consecutive_non_improving_iterations: 2
  same_blocker_repeated: 2

repair:
  mode: autopilot
  agent:
    provider: generic-cli
    command:
      - codex
      - exec
      - "{prompt_file}"
  permissions:
    documentation: true
    source_code: true
    tests: true
    # This example paper's headline defect needs a real experiment, so the loop
    # is expected to stop with HUMAN_DECISION_REQUIRED. That is the correct
    # outcome, not a failure.
    experiments: false
    datasets: false
    scientific_claims: false
    methodology: false
