version: 1

profile: generic-document

artifact:
  type: document
  paths:
    - architecture.md

models:
  default:
    provider: ${VERITAS_DEFAULT_PROVIDER:-anthropic}
    model: ${VERITAS_DEFAULT_MODEL:-claude-opus-5}
    tls_verify: ${VERITAS_TLS_VERIFY:-true}

gate:
  fail_on:
    - critical
  max_major: 2

execution:
  allow: []
